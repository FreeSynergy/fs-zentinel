# Second, independent secret scanner in CI (gitleaks, MIT licence), next to scripts/test/scan_secrets.sh (ADR 0054).
# The release tarball is checked against a hash pinned here AND against the maker's checksum file; the repository history is scanned.
name: secrets-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned and verified)
        env:
          V: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gl" && cd "$RUNNER_TEMP/gl"
          gh release download "v$V" -R gitleaks/gitleaks -p "gitleaks_${V}_linux_x64.tar.gz" -p "gitleaks_${V}_checksums.txt"
          echo "$SHA256  gitleaks_${V}_linux_x64.tar.gz" | sha256sum --check --strict -
          grep -F "gitleaks_${V}_linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum --check --strict -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Scan (findings are redacted in the log)
        run: '"$RUNNER_TEMP/gl/gitleaks" git --redact --no-banner --verbose .'
