# Cheap gate on every push and pull request: mirror.toml, capabilities, config placeholders, generated docs and export. No secrets.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repo check (placeholders only, docs and export up to date)
        run: python3 -I scripts/repo_tool.py check
      - name: Shell scripts
        run: bash -n scripts/verify-mirror.sh && (command -v shellcheck >/dev/null && shellcheck scripts/*.sh || true)
